name: Release
# Push a tag like v0.2.0 to publish a release with the app package.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Package
        run: |
          cd dist && zip -r "../placesbuilder-${GITHUB_REF_NAME}.zip" server web && cd ..
          sha256sum placesbuilder-*.zip > SHA256SUMS
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" placesbuilder-*.zip SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
