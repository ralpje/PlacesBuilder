name: Release
# Push a tag like v0.2.0 to publish a release with the app package.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Package
        run: |
          cd dist && zip -r "../placesbuilder-${GITHUB_REF_NAME}.zip" server web && cd ..
          # Stamp this release into the self-host template, then compile it to ARM for the Deploy to Azure button.
          sed -i "s/^param appVersion string = .*/param appVersion string = '${GITHUB_REF_NAME}'/" deploy/main.bicep
          az bicep build --file deploy/main.bicep --outfile azuredeploy.json
          cp scripts/configure-auth.ps1 configure-auth.ps1
          sha256sum placesbuilder-*.zip azuredeploy.json configure-auth.ps1 > SHA256SUMS
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # release already exists (for example made in the GitHub UI): attach the files
            gh release upload "$GITHUB_REF_NAME" placesbuilder-*.zip azuredeploy.json configure-auth.ps1 SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" placesbuilder-*.zip azuredeploy.json configure-auth.ps1 SHA256SUMS \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
      - name: Publish template for the Deploy to Azure button
        # The portal fetches the template in the browser. GitHub release downloads have no CORS headers,
        # raw.githubusercontent.com does, so the compiled template also goes to a dedicated branch.
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir "$RUNNER_TEMP/tpl" && cp azuredeploy.json "$RUNNER_TEMP/tpl/"
          cd "$RUNNER_TEMP/tpl"
          git init -q -b deploy-template && git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Template for $GITHUB_REF_NAME"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy-template
