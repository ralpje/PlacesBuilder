name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile and lint the self-host template
        run: |
          az bicep build --file deploy/main.bicep --outfile "$RUNNER_TEMP/azuredeploy.json"
          az bicep lint --file deploy/main.bicep
