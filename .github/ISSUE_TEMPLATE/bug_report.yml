name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What did you expect instead? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version, description: "Shown at the bottom of the left menu, for example v0.1.6." }
  - type: input
    id: browser
    attributes: { label: Browser and OS }
  - type: markdown
    attributes: { value: "Do not attach real floor plans or tenant data. Use made-up samples. Security problems: see SECURITY.md." }
